name: Build

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: make lint test
      - name: Check shell syntax
        shell: bash
        run: |
          bash -n .profile
          bash -n .githooks/pre-commit
          for file in scripts/* cmux/*.sh claude/skills/*/*.sh; do
            bash -n "$file"
          done
